; Sample configuration for RtmpGatewayConsole
; Delphi/Windows-friendly single-process runner for:
; - ingest only
; - ingest + RTMP restream

[server]
bind_address=0.0.0.0
port=1935
max_sessions=8
max_chunk_size=131072
max_message_size=8388608
max_chunk_streams=64
read_timeout_ms=10000
write_timeout_ms=10000
buffer_max_packets=1024
buffer_max_bytes=16777216
buffer_max_duration_ms=3000
enable_analyzer=true

[relay]
enabled=false
target_url=rtmp://127.0.0.1:1940/live/test
app=
stream_key=
connect_timeout_ms=10000
reconnect_delay_ms=1000
max_reconnect_delay_ms=15000
out_chunk_size=4096
timestamp_mode=pass

[logging]
level=info
packet_log_every=0
