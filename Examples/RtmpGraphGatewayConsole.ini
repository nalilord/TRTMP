; Sample configuration for RtmpGraphGatewayConsole
; Named graph sections let you build branch pipelines from the stable
; program output: relay targets, buffers, decode nodes, and players.

[server]
bind_address=0.0.0.0
port=1935
max_sessions=8
max_chunk_size=131072
max_message_size=8388608
max_chunk_streams=64
read_timeout_ms=10000
write_timeout_ms=10000
buffer_max_packets=1024
buffer_max_bytes=16777216
buffer_max_duration_ms=3000
enable_analyzer=true

[pipeline]
idle_timeout_ms=3000
default_priority=100
active_source=
; source IDs are keyed as app/stream
; source_priorities=live/primary=10,live/fallback=20
source_priorities=

[logging]
level=info
packet_log_every=0

; Root packet parent names available by default:
; - program
; - program_stats
; - program_switcher
;
; Supported graph kinds:
; - stats
; - tee
; - relay_policy
; - buffer
; - relay_sink
; - video_decoder          (requires --with-ffmpeg)
; - callback_player       (requires --with-ffmpeg)
; - sfml_player           (requires --with-ffmpeg --with-sfml)

[graph.relay_policy_primary]
enabled=false
kind=relay_policy
parent=program
allow_metadata=true
allow_audio=true
allow_video=true
wait_for_keyframe=true

[graph.relay_primary]
enabled=false
kind=relay_sink
parent=relay_policy_primary
target_url=rtmp://127.0.0.1:1940/live/test
app=
stream_key=
connect_timeout_ms=10000
reconnect_delay_ms=1000
max_reconnect_delay_ms=15000
out_chunk_size=4096
timestamp_mode=pass
buffer_max_packets=1024
buffer_max_bytes=16777216
buffer_max_duration_ms=3000

[graph.decode_program]
enabled=false
kind=video_decoder
parent=program

[graph.player_console]
enabled=false
kind=callback_player
parent=decode_program
log_every_frames=30

[graph.preview_buffer]
enabled=false
kind=buffer
parent=program
max_packets=256
max_bytes=4194304
max_duration_ms=2000
